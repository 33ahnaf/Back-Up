<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23 JS in the browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button>Click me!</button>
    <h3>Hello, World!</h3>
    <script src="script.js"></script>
    <!-- Advantages of using separate script file using src attribute of script tag:
    1. Saparetion of concerns
    2. Browser Caching -->
    <script>
        alert("Hello, World!");
    </script>
    <!-- I think the script that is in the upper place will have the higher priority. -->
</body>
</html>
