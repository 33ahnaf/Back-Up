; ============================================================================
;  Universal SPI TFT Auto-Detection Tool
;  Target: ESP32-WROOM-32 (Arduino framework, PlatformIO)
; ============================================================================

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; C++17 is required for constexpr / enum class usage throughout the project.
build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; ---- Optional / compile-time feature flags -----------------------------
    ; Comment/uncomment any of these to change tool behaviour without
    ; touching source files.
    -DENABLE_SERIAL_LOG        ; verbose serial logging of every test step
    -DENABLE_ROTATION_TEST     ; cycle through all 4 rotations per driver
    -DENABLE_BGR_TEST          ; cycle RGB / BGR color order per rotation
    -DENABLE_INVERT_TEST       ; cycle display inversion OFF / ON
    -DENABLE_PATTERN_TESTS   ; also run bar/checkerboard/gradient patterns
    -DENABLE_SLOW_SPI        ; force low SPI clock (8 MHz) for noisy wiring
    ; -DENABLE_FAST_SPI        ; force max SPI clock (40 MHz)
    -DENABLE_PIN_PERMUTATION_TEST
    ;   Also sweep all 120 permutations of the CS/DC/RST/MOSI/SCK pin pool
    ;   (24 if RST is tied to 3V3/EN, i.e. pins::RST = -1), not just the
    ;   labelled assignment in main.cpp - useful if you're not sure the
    ;   wiring diagram/silkscreen you followed is actually correct. Forces
    ;   Serial on regardless of ENABLE_SERIAL_LOG so the active permutation
    ;   is always visible. Combine with every other sweep flag above and
    ;   full coverage will take a long time (120 x drivers x rotations x
    ;   color orders x inversions); leaving ROTATION/BGR/INVERT off keeps
    ;   each permutation's pass quick.

lib_deps =
