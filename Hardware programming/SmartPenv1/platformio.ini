; SmartPen — IMU-only handwriting tracker
; Target: Seeed Studio XIAO ESP32-S3
; Framework: Arduino (via PlatformIO)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; --- Build ---
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv

; -O2 gives us a good speed/size tradeoff for the float-heavy Madgwick math.
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ASYNC_TCP_USE_WDT=0

; --- Dependencies ---
; We deliberately keep this list minimal:
;   - Wire is part of the ESP32 Arduino core (I2C bus) — not an "extra" dependency.
;   - The MPU6050 driver itself is hand-written register-level code (see MPU6050.cpp),
;     not a vendor black-box library — this is intentional, per project spec.
;   - The Madgwick AHRS filter is hand-implemented (see Madgwick.cpp), not pulled from
;     a closed-source/black-box fusion library.
;   - AsyncTCP + ESPAsyncWebServer are the only "real" third-party deps, because
;     writing a correct non-blocking async HTTP+WebSocket stack from scratch is out of
;     scope and would not add anything pedagogically — the value here is in the sensor
;     fusion and tracking pipeline, not in reimplementing TCP framing.
lib_deps =
    esphome/AsyncTCP-esphome @ ^2.0.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0

; Uploads the contents of data/ to LittleFS with `pio run -t uploadfs`
