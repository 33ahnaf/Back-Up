<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min/Max Height/Width</title>
    <style>
        .container{
            background-color: aqua;
            width: 360px;
            height: 35vh;
            max-height: 50vh;
            /*
            min-height : set the minimum height
            min-width  : set the minimum width
            max-height : set the maximum height
            max-width  : set the maximum height
            */
        }
    </style>
</head>
<body>
    <div class="container">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Distinctio, veritatis voluptatum natus deserunt ullam nisi quia architecto rerum possimus eos eum perferendis consequatur voluptates laborum eius animi molestias necessitatibus modi earum aspernatur. Culpa, temporibus?
    </div>
</body>
</html>
