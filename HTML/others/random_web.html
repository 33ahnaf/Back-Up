<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Songs</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .song {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ffffff;
            border-radius: 8px;
            display: inline-block;
            width: 300px;
        }
        iframe {
            width: 100%;
            height: 200px;
            border-radius: 8px;
        }
		h2 {
			font-style: italic;
		}
    </style>
</head>
<body>
    <h1>My Favorite Songs</h1>
    
    <div class="song">
        <h2>Ride It</h2>
        <iframe src="Jay Sean - Ride It (Lyrics).mp4" frameborder="0" allowfullscreen></iframe>
	</div>
    
    <div class="song">
        <h2>Dandelions</h2>
        <iframe src="Ruth B. - Dandelions (Lyrics).mp4" frameborder="0" allowfullscreen></iframe>
    </div>
    
    <div class="song">
        <h2>Play Date</h2>
        <iframe src="Play Date.mp4" frameborder="0" allowfullscreen></iframe>
    </div>
</body>
</html>
