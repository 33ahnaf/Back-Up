<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --body-bg: radial-gradient(circle, #db143f 0%, #941d58 100%);
            --body-color: #831843;
            --card-bg: rgba(255, 250, 245, 0.95);
            --card-bx-shadow: 0 25px 50px rgba(70, 3, 30, 0.4);
            --subtitle-color: #b54a7a;
            --drop-zone-border: 4px dashed #ff2e97;
            --drop-zone-bg: #ffe4f1;
            --drop-zone-dragover-bg: #ffd1e8;
            --drop-zone-i-color: #ff2e97;
            --progress-bg: #c9c2c2;
            --bar-bg: linear-gradient(90deg, #ff2e97, #ff85c1);
        }

        :root:has(#theme-toggle:checked) {
            --body-bg: #0f172a;
            --body-color: rgb(200, 210, 253);
            --card-bg: #1e293b;
            --card-bx-shadow: 0 25px 50px rgba(0, 0, 0, .4);
            --subtitle-color: #4a78b5;
            --drop-zone-border: 4px dashed #294f81;
            --drop-zone-bg: #121e3a;
            --drop-zone-dragover-bg: #142242;
            --drop-zone-i-color: rgb(81, 193, 201);
            --progress-bg: #334155;
            --bar-bg: #22c55e;
        }

        body {
            background: var(--body-bg);
            color: var(--body-color);
            font-family: Arial, sans-serif, Helvetica;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            transition: background 0.3s ease;
            /* Required for the splash text */
        }

        .card {
            position: relative;
            /* background: #fff0d9; */
            background: var(--card-bg);
            padding: 40px;
            border-radius: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: var(--card-bx-shadow);
            backdrop-filter: blur(10px);
        }

        h2 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .subtitle {
            color: var(--subtitle-color);
            margin-bottom: 30px;
            font-size: 15px;
        }

        .drop-zone {
            border: var(--drop-zone-border);
            background: var(--drop-zone-bg);
            border-radius: 25px;
            padding: 50px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            margin-bottom: 20px;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            background: var(--drop-zone-dragover-bg);
            transform: scale(1.02);
            border-style: solid;
        }

        .drop-zone p {
            font-weight: bold;
            margin: 0;
            pointer-events: none;
        }

        .drop-zone i {
            display: block;
            font-size: 33px;
            margin-bottom: 10px;
            color: var(--drop-zone-i-color);
        }

        #file {
            display: none;
        }

        button {
            background: white;
            color: rgb(34, 197, 94, 0.9);
            font-weight: bold;
            border: none;
            padding: 13px 35px;
            border: 2px solid rgb(34, 197, 94, 0.9);
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgb(34, 197, 94, 0.9);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgb(34, 197, 94);
            color: white;
            background: rgb(34, 197, 94);
        }

        .progress {
            width: 100%;
            background: var(--progress-bg);
            border-radius: 20px;
            margin-top: 25px;
            height: 12px;
            overflow: hidden;
            display: none;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: var(--bar-bg);
            border-radius: 20px;
            transition: width 0.3s;
        }

        #status {
            font-size: 14px;
            margin-top: 10px;
            font-weight: 600;
        }

        .disconnect {
            margin-top: 20px;
            background: white;
            color: #ff2e3f;
            border: 2px solid #ff2e3f;
            padding: 10px;
            font-size: 14px;
            box-shadow: 0 4px 15px #ff2e3f;
        }

        .disconnect:hover {
            background: #ff2e3f;
            color: white;
            box-shadow: 0 6px 20px #ff2e3f;
        }

        .splash-text-area {
            margin-top: 25px;
            /* color: #00CAFF; */
            /* color: #CE85E4; */
            color: #D4AF37;
            font-size: 18px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1.2s ease-out forwards;
            animation-delay: 3s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        .toggle-container {
            position: absolute;
            top: 25px;
            right: 30px;
        }

        .switch-label {
            width: 50px;
            height: 26px;
            background-color: #cbd5e1;
            display: flex;
            align-items: center;
            border-radius: 50px;
            padding: 3px;
            cursor: pointer;
            transition: background-color 0.4s;
            position: relative;
        }

        .switch-ball {
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Animation: When checked, turn green and slide ball */
        :root:has(#theme-toggle:checked) .switch-label {
            background-color: #22c55e;
            /* Match your button green */
        }

        :root:has(#theme-toggle:checked) .switch-ball {
            transform: translateX(24px);
        }

        /* Add a smooth fade to everything when switching */
        body,
        .card,
        .drop-zone,
        .subtitle {
            transition: all 0.4s ease-in-out;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="toggle-container">
            <input type="checkbox" id="theme-toggle" hidden>
            <label for="theme-toggle" class="switch-label">
                <span class="switch-ball"></span>
            </label>
        </div>
        <h2>Music Streamer</h2>
        <p class="subtitle">Upload your audio files here</p>

        <div class="drop-zone" onclick="document.getElementById('file').click()" id="drop-zone">
            <p id="file-name">Drop <i>.wav</i> or Click to Browse</p>
            <input type="file" id="file" accept=".wav" onchange="updateFileName()">
        </div>

        <button onclick="upload()">Upload Now</button>

        <div class="progress" id="progress-container">
            <div class="bar" id="bar"></div>
        </div>
        <p id="status"></p>

        <button class="disconnect" onclick="disconnect()">Disconnect Stream</button>
    </div>
    <div class="splash-text-area">
        <p id="splash-text"></p>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file');
        const texts = ["Acceptance", "Patience", "Patience"];

        let text = `${texts[Math.floor(Math.random() * texts.length)]} is a great virtue.`;
        document.getElementById('splash-text').innerHTML = text;

        function updateFileName() {
            const name = fileInput.files[0] ? fileInput.files[0].name : "Drop your .WAV here or Click";
            document.getElementById('file-name').innerText = name;
        }

        ['dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                if (evt === 'dragover') dropZone.classList.add('dragover');
                else dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', e => {
            fileInput.files = e.dataTransfer.files;
            updateFileName();
        });

        function upload() {
            let file = fileInput.files[0];
            if (!file) {
                alert("Please select a file first!");
                return;
            }

            document.getElementById("progress-container").style.display = "block";
            let xhr = new XMLHttpRequest();
            let formData = new FormData();
            formData.append("data", file);

            xhr.upload.onprogress = function (e) {
                if (e.lengthComputable) {
                    let p = (e.loaded / e.total) * 100;
                    document.getElementById("bar").style.width = p + "%";
                    document.getElementById("status").innerText = "Sending magic... " + p.toFixed(1) + "%";
                }
            };

            xhr.onload = function () {
                document.getElementById("status").innerText = "Upload complete!";
                setTimeout(() => {
                    document.getElementById("progress-container").style.display = "none";
                    document.getElementById("bar").style.width = "0%";
                }, 2000);
            };

            xhr.open("POST", "/upload", true);
            xhr.send(formData);
        }

        function disconnect() {
            document.getElementById('status').innerText = 'Disconnected';
            fileInput.value = "";
            fetch("/disconnect");
        }
    </script>
</body>

</html>
